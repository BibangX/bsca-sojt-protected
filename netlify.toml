[build]
  command = "npm run build"
  publish = "public"
[build.environment]
  NODE_VERSION = "22"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pg", "google-auth-library", "serverless-http"]
  included_files = ["server.mjs", "database.mjs", "portal/**", "login.html", "login.js", "account.css"]
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/portal"
  status = 200
  force = true
